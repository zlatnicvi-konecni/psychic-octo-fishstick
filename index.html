<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sklad kamenů</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  max-width:560px;
  margin:auto;
  padding:16px;
  background:#f5f5f5;
  color:#222
}
h1{font-size:25px;margin:4px 0 18px}
h2{font-size:20px;margin:0 0 12px}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 10px #0001
}
input,select,textarea{
  width:100%;
  padding:13px;
  margin:5px 0 10px;
  font-size:17px;
  border:1px solid #bbb;
  border-radius:10px;
  background:#fff
}
textarea{min-height:80px;resize:vertical}
button{
  border:0;
  border-radius:11px;
  padding:14px 16px;
  margin:4px 2px;
  font-size:17px;
  cursor:pointer;
  background:#e5e5e5
}
button.primary{
  width:100%;
  font-size:20px;
  font-weight:bold
}
button.minus{font-weight:bold}
.row{
  display:flex;
  gap:7px;
}
.row button{flex:1}
.hidden{display:none}
.status{
  font-size:14px;
  color:#666;
  margin-bottom:12px
}
.stock{
  font-size:46px;
  font-weight:bold;
  text-align:center;
  margin:12px 0
}
.details{
  line-height:1.6;
  font-size:17px
}
.code{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  letter-spacing:1px;
  margin:8px 0
}
.error{
  color:#b00020;
  font-weight:bold
}
.success{
  color:#126b28;
  font-weight:bold
}
.small{
  font-size:13px;
  color:#777
}
hr{
  border:0;
  border-top:1px solid #ddd;
  margin:18px 0
}
summary{
  cursor:pointer;
  font-weight:bold;
  font-size:18px
}
</style>
</head>

<body>

<h1>💎 Sklad kamenů</h1>
<div id="status" class="status">Kontroluji připojení…</div>

<!-- REGISTRACE -->
<div id="registration" class="card hidden">
  <h2>Autorizace telefonu</h2>

  <div>
    Tento telefon ještě není autorizovaný.
    V Apps Scriptu spusť funkci <b>createRegistrationKey()</b>
    a sem vlož vygenerovaný klíč.
  </div>

  <input id="registrationKey"
         placeholder="Registrační klíč"
         autocomplete="off">

  <button class="primary" onclick="registerDevice()">
    🔐 Registrovat tento telefon
  </button>

  <div id="registrationResult" class="small"></div>
</div>

<!-- HLAVNÍ APLIKACE -->
<div id="app" class="hidden">

  <!-- HLEDÁNÍ -->
  <div class="card">
    <h2>Najít kámen</h2>

    <input id="code"
           placeholder="Kód kamene, např. D-0001"
           autocomplete="off"
           autocapitalize="characters">

    <button class="primary" onclick="loadStone()">
      🔎 Zjistit stav
    </button>

    <div id="result"></div>
  </div>

  <!-- NOVÝ KÁMEN -->
  <details class="card">
    <summary>➕ Nový kámen</summary>

    <hr>

    <label>Druh</label>
    <input id="newType" value="Diamant">

    <label>Tvar</label>
    <input id="newShape" placeholder="Round">

    <label>Velikost</label>
    <input id="newSize" placeholder="1.0">

    <label>Barva</label>
    <input id="newColor" placeholder="H">

    <label>Čistota</label>
    <input id="newClarity" placeholder="SI1">

    <label>Počet</label>
    <input id="newQuantity" type="number" min="0" step="1" value="1">

    <label>Jednotka</label>
    <input id="newUnit" value="ks">

    <label>Pozice</label>
    <input id="newLocation" placeholder="např. šuplík A3">

    <label>Dodavatel</label>
    <input id="newSupplier" placeholder="">

    <label>Poznámka</label>
    <textarea id="newNote"></textarea>

    <button class="primary" onclick="createStone()">
      💎 Vytvořit kámen
    </button>

    <div id="createResult"></div>
  </details>

  <!-- HISTORIE -->
  <details class="card">
    <summary>📜 Historie</summary>
    <hr>
    <button class="primary" onclick="loadHistory()">
      Načíst historii
    </button>
    <div id="historyResult"></div>
  </details>

  <!-- ZAŘÍZENÍ -->
  <div class="card">
    <details>
      <summary>⚙️ Telefon</summary>
      <hr>

      <div class="small">
        ID zařízení:
        <br>
        <span id="deviceId"></span>
      </div>

      <br>

      <button onclick="resetDevice()">
        Zrušit autorizaci tohoto telefonu
      </button>
    </details>
  </div>

</div>

<script>
/* =========================================================
   NASTAVENÍ
   ========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzxw_flfqDBUxvL8askca7It_N-M-wjwV7nxYU-OHjr5Z1_XvcrRPciydJLUC8AGME/exec';

const STORAGE_DEVICE_ID = 'inventoryDeviceId';
const STORAGE_TOKEN = 'inventoryDeviceToken';

/* Apps Script může odpověď doručit přes script.google.com
   nebo přes script.googleusercontent.com. */
const API_ORIGINS = new Set([
  new URL(API_URL).origin,
  'https://script.googleusercontent.com'
]);

let stone = null;


/* =========================================================
   ZÁKLAD
   ========================================================= */

function getDeviceId(){
  let id = localStorage.getItem(STORAGE_DEVICE_ID);

  if(!id){
    id = (crypto.randomUUID)
      ? crypto.randomUUID()
      : 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2);

    localStorage.setItem(STORAGE_DEVICE_ID,id);
  }

  return id;
}

function getToken(){
  return localStorage.getItem(STORAGE_TOKEN) || '';
}

function setToken(token){
  localStorage.setItem(STORAGE_TOKEN,token);
}

function clearToken(){
  localStorage.removeItem(STORAGE_TOKEN);
}

function setStatus(text,error=false){
  const el=document.getElementById('status');
  el.textContent=text;
  el.className=error ? 'status error' : 'status';
}

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g,function(c){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c];
  });
}


/* =========================================================
   KOMUNIKACE S APPS SCRIPTEM
   ========================================================= */

function callApi(request){
  return new Promise(function(resolve,reject){

    const iframe=document.createElement('iframe');

    iframe.name='api_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2);

    iframe.style.display='none';

    document.body.appendChild(iframe);

    const form=document.createElement('form');

    form.method='POST';
    form.action=API_URL;
    form.target=iframe.name;
    form.style.display='none';

    const input=document.createElement('input');

    input.type='hidden';
    input.name='payload';
    input.value=JSON.stringify(request);

    form.appendChild(input);
    document.body.appendChild(form);

    let finished=false;

    function cleanup(){
      if(finished) return;
      finished=true;

      window.removeEventListener('message',onMessage);

      setTimeout(function(){
        form.remove();
        iframe.remove();
      },300);
    }

    function onMessage(event){

      if(!API_ORIGINS.has(event.origin)) return;

      const data=event.data;

      if(!data || data.type!=='inventory-api') return;

      cleanup();

      if(data.status==='OK'){
        resolve(data.data);
      }else{
        reject(
          new Error(data.error || 'SERVER_ERROR')
        );
      }
    }

    window.addEventListener('message',onMessage);

    const timeout=setTimeout(function(){
      if(finished) return;

      cleanup();
      reject(new Error('TIMEOUT'));
    },20000);

    Promise.resolve().then(function(){
      if(finished) return;
      form.submit();
    }).catch(function(err){
      clearTimeout(timeout);
      cleanup();
      reject(err);
    });

  });
}


/* =========================================================
   AUTORIZACE
   ========================================================= */

async function registerDevice(){

  const key=document
    .getElementById('registrationKey')
    .value
    .trim();

  if(!key){
    showRegistrationMessage(
      'Zadej registrační klíč.',
      true
    );
    return;
  }

  showRegistrationMessage('Registruji telefon…');

  try{

    const result=await callApi({
      action:'register',
      deviceId:getDeviceId(),
      registrationKey:key
    });

    if(!result || !result.token){
      throw new Error('SERVER_ERROR');
    }

    setToken(result.token);

    document.getElementById('registrationKey').value='';

    showRegistrationMessage(
      'Telefon byl úspěšně autorizován.',
      false
    );

    showApp();

  }catch(error){

    showRegistrationMessage(
      readableError(error),
      true
    );
  }
}

function showRegistrationMessage(text,error=false){
  const el=document.getElementById('registrationResult');
  el.textContent=text;
  el.className=error ? 'small error' : 'small success';
}


/* =========================================================
   START
   ========================================================= */

function init(){

  document.getElementById('deviceId').textContent=getDeviceId();

  if(getToken()){
    showApp();
  }else{
    showRegistration();
  }
}

function showRegistration(){

  document
    .getElementById('registration')
    .classList.remove('hidden');

  document
    .getElementById('app')
    .classList.add('hidden');

  setStatus('Telefon čeká na autorizaci.');
}

async function showApp(){

  document
    .getElementById('registration')
    .classList.add('hidden');

  document
    .getElementById('app')
    .classList.remove('hidden');

  setStatus('Autorizováno');

  /* Ověření tokenu jednoduchým dotazem.
     Pokud zařízení už není povolené, vrátíme uživatele
     na registraci. */
  try{
    await callApi({
      action:'get',
      deviceId:getDeviceId(),
      token:getToken(),
      code:'D-0000'
    });
  }catch(error){

    if(
      error.message==='UNAUTHORIZED_DEVICE' ||
      error.message==='DEVICE_BLOCKED'
    ){
      clearToken();
      showRegistration();
      showRegistrationMessage(
        'Tento telefon už není autorizovaný. Zaregistruj ho znovu.',
        true
      );
    }
  }
}


/* =========================================================
   HLEDÁNÍ KAMENE
   ========================================================= */

async function loadStone(){

  const code=document
    .getElementById('code')
    .value
    .trim()
    .toUpperCase();

  if(!code) return;

  setResult('Hledám…');

  try{

    const result=await callApi({
      action:'get',
      deviceId:getDeviceId(),
      token:getToken(),
      code:code
    });

    showStone(result);

  }catch(error){

    handleApiError(error);
  }
}


/* =========================================================
   ZOBRAZENÍ KAMENE
   ========================================================= */

function showStone(s){

  stone=s;

  const result=document.getElementById('result');

  result.innerHTML=`
    <div class="card">

      <div class="code">${esc(s.code)}</div>

      <div class="details">
        <b>${esc(s.type)}</b>
        ${s.shape ? ' · '+esc(s.shape) : ''}
        <br>

        ${s.size ? esc(s.size)+' mm' : ''}
        ${s.color ? ' · '+esc(s.color) : ''}
        ${s.clarity ? ' · '+esc(s.clarity) : ''}
        <br>

        ${s.location ? 'Pozice: '+esc(s.location) : ''}
      </div>

      <div class="stock">
        ${esc(s.quantity)} ${esc(s.unit || 'ks')}
      </div>

      <div class="row">
        <button class="minus" onclick="moveStock(-5)">−5</button>
        <button class="minus" onclick="moveStock(-2)">−2</button>
        <button class="minus" onclick="moveStock(-1)">−1</button>
      </div>

      <div class="row">
        <button onclick="moveStock(1)">+1</button>
        <button onclick="moveStock(5)">+5</button>
      </div>

    </div>
  `;
}

function setResult(text){

  document.getElementById('result').innerHTML=
    '<div class="card">'+esc(text)+'</div>';
}


/* =========================================================
   SKLADOVÝ POHYB
   ========================================================= */

async function moveStock(amount){

  if(!stone) return;

  try{

    const result=await callApi({
      action:'stock',
      deviceId:getDeviceId(),
      token:getToken(),
      code:stone.code,
      amount:amount,
      note:'Mobil'
    });

    stone.quantity=result.newStock;

    showStone({
      ...stone,
      quantity:result.newStock
    });

  }catch(error){

    handleApiError(error);
  }
}


/* =========================================================
   NOVÝ KÁMEN
   ========================================================= */

async function createStone(){

  const quantity=document
    .getElementById('newQuantity')
    .value;

  try{

    const result=await callApi({
      action:'create',
      deviceId:getDeviceId(),
      token:getToken(),

      type:document.getElementById('newType').value,
      shape:document.getElementById('newShape').value,
      size:document.getElementById('newSize').value,
      color:document.getElementById('newColor').value,
      clarity:document.getElementById('newClarity').value,

      quantity:quantity,
      unit:document.getElementById('newUnit').value,
      location:document.getElementById('newLocation').value,
      supplier:document.getElementById('newSupplier').value,
      note:document.getElementById('newNote').value
    });

    document.getElementById('createResult').innerHTML=
      `<div class="success">
        Vytvořeno. Kód kamene:
        <div class="code">${esc(result.code)}</div>
      </div>`;

    document.getElementById('code').value=result.code;

    await loadStone();

  }catch(error){

    document.getElementById('createResult').innerHTML=
      `<div class="error">${esc(readableError(error))}</div>`;
  }
}


/* =========================================================
   HISTORIE
   ========================================================= */

async function loadHistory(){

  const box=document.getElementById('historyResult');

  box.innerHTML='Načítám…';

  try{

    const rows=await callApi({
      action:'history',
      deviceId:getDeviceId(),
      token:getToken()
    });

    if(!rows || rows.length===0){
      box.innerHTML='<p>Historie je prázdná.</p>';
      return;
    }

    box.innerHTML=rows.map(function(r){

      const change=Number(r.amount || 0);

      return `
        <div style="padding:10px 0;border-bottom:1px solid #ddd">
          <b>${esc(r.code)}</b><br>
          ${esc(r.operation)}
          :
          <b>${change>0?'+':''}${change}</b>
          → stav ${esc(r.stock)}
          <br>
          <span class="small">${esc(r.note || '')}</span>
        </div>
      `;

    }).join('');

  }catch(error){

    box.innerHTML=
      `<div class="error">${esc(readableError(error))}</div>`;
  }
}


/* =========================================================
   CHYBY
   ========================================================= */

function handleApiError(error){

  const code=error && error.message
    ? error.message
    : String(error);

  if(
    code==='UNAUTHORIZED_DEVICE' ||
    code==='DEVICE_BLOCKED'
  ){

    clearToken();
    showRegistration();

    showRegistrationMessage(
      'Telefon není autorizovaný nebo byl zablokovaný.',
      true
    );

    return;
  }

  setResult(readableError(error));
}

function readableError(error){

  const code=error && error.message
    ? error.message
    : String(error);

  const messages={
    TIMEOUT:'Server neodpověděl včas.',
    STONE_NOT_FOUND:'Kámen s tímto kódem nebyl nalezen.',
    UNAUTHORIZED_DEVICE:'Telefon není autorizovaný.',
    DEVICE_BLOCKED:'Tento telefon byl zablokován.',
    RATE_LIMITED:'Příliš mnoho požadavků. Chvíli počkej.',
    INVALID_REGISTRATION_KEY:'Registrační klíč není správný.',
    REGISTRATION_EXPIRED:'Registrační klíč už vypršel.',
    REGISTRATION_DISABLED:'Registrace je momentálně vypnutá.',
    INVALID_CODE:'Neplatný kód kamene.',
    MISSING_CODE:'Chybí kód kamene.',
    INVALID_QUANTITY:'Neplatné množství.',
    STOCK_NEGATIVE:'Nelze vydat více kusů, než je na skladě.',
    SERVER_ERROR:'Chyba serveru.'
  };

  return messages[code] || code;
}


/* =========================================================
   RESET TELEFONU
   ========================================================= */

function resetDevice(){

  clearToken();

  document.getElementById('result').innerHTML='';
  document.getElementById('registrationResult').innerHTML='';

  showRegistration();

  showRegistrationMessage(
    'Autorizace tohoto telefonu byla lokálně odstraněna.',
    false
  );
}


/* =========================================================
   ENTER V KÓDU
   ========================================================= */

document.getElementById('code').addEventListener(
  'keydown',
  function(event){
    if(event.key==='Enter') loadStone();
  }
);


/* =========================================================
   SPUŠTĚNÍ
   ========================================================= */

init();

</script>

</body>
</html>
